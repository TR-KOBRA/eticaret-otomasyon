<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-ticaret Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
<div class="uyg">
  <aside class="yan">
    <div class="logo"><i>e</i><div>E-ticaret Paneli<small>AliExpress → marka → satış</small></div></div>
    <div class="grup">Genel</div>
    <button class="men" data-git="ana"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Ana sayfa<span class="rozet r-warn" id="rzGorev" hidden></span></button>
    <div class="grup">Ürün</div>
    <button class="men" data-git="kesif"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Ürün keşfi<span class="rozet r-gri" id="rzAday" hidden></span></button>
    <button class="men" data-git="tarama"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Günlük tarama</button>
    <div class="grup">Satış</div>
    <button class="men" data-git="projeler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="5" height="18" rx="1.5"/><rect x="10" y="3" width="5" height="12" rx="1.5"/><rect x="17" y="3" width="4" height="8" rx="1.5"/></svg>Projeler</button>
    <button class="men" data-git="hesap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 11h2M14 11h2M8 15h2M14 15h2M8 19h8"/></svg>Kâr hesaplayıcı</button>
    <div class="grup">Sistem</div>
    <button class="men" data-git="ayarlar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Ayarlar & bağlantılar</button>
    <div class="grup">Aktif projeler</div>
    <div class="pl" id="yanProjeler"></div>
    <div class="alt">Yalnızca bu bilgisayarda çalışır.<br>Para harcayan ve yayınlayan her adım senin onayında.</div>
  </aside>
  <div>
    <div class="ust-bar"><div class="yol" id="yol"></div>
      <div class="sag"><button class="btn" onclick="yeniArastirma()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Ürün incele</button></div>
    </div>
    <main id="ana"><div class="iskelet"></div></main>
  </div>
</div>
<div class="isler" id="isler"></div>
<script src="/app.js"></script>
</body>
</html>
